<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

    <!-- Ambient particle field. Deferred, and skipped entirely on small screens
         or when the visitor has asked for reduced motion. -->
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"
      integrity="sha512-Kef5sc7gfTacR7TZKelcrRs15ipf7+t+n7Zh6mKNJbmW+/RRdCW9nwfLn4YX0s2nO6Kv5Y2ChqgIakaC6PW09A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-slate-950 text-white relative">
    <div style="display: contents" class="relative z-[1]">%sveltekit.body%</div>

    <div
      aria-hidden="true"
      class="pointer-events-none fixed inset-0 z-[-1] opacity-70"
      id="particles-js"
    ></div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var small = window.matchMedia("(max-width: 767px)").matches;
        if (calm || small || typeof particlesJS === "undefined") return;
        particlesJS.load("particles-js", "assets/particles.json");
      });
    </script>
  </body>
</html>
